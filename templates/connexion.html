{% extends 'base.html' %}

{% block content %}
<style>
    .login-section {
        background: linear-gradient(135deg, #1a5f7a 0%, #2d8faa 100%);
        min-height: calc(100vh - 200px);
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
    }
    
    .login-section::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?w=600&h=400&fit=crop') center/cover no-repeat;
        opacity: 0.08;
        z-index: 0;
    }
    
    .login-card {
        position: relative;
        z-index: 2;
        border: none;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    
    .login-card .card-header {
        background: linear-gradient(135deg, #1a5f7a 0%, #2d8faa 100%);
        padding: 1.5rem;
        border-bottom: none;
    }
    
    .login-card .card-header h3 {
        font-weight: 700;
        margin-bottom: 0;
    }
    
    .login-card .card-header p {
        opacity: 0.9;
        font-size: 0.9rem;
    }
    
    .login-card .card-body {
        padding: 2rem;
    }
    
    .input-group-text {
        background: #f8f9fa;
        border-right: none;
        color: #1a5f7a;
    }
    
    .form-control {
        border-left: none;
    }
    
    .form-control:focus {
        border-color: #1a5f7a;
        box-shadow: 0 0 0 0.2rem rgba(26,95,122,0.25);
    }
    
    .btn-login {
        background: linear-gradient(135deg, #1a5f7a 0%, #2d8faa 100%);
        border: none;
        border-radius: 50px;
        padding: 12px;
        font-weight: 600;
        transition: all 0.3s;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(26,95,122,0.3);
    }
    
    .card-footer {
        background: #f8f9fa;
        border-top: 1px solid #e9ecef;
        padding: 1rem;
    }
    
    @media (max-width: 768px) {
        .login-card .card-body {
            padding: 1.5rem;
        }
        .login-section {
            min-height: calc(100vh - 150px);
        }
    }
</style>

<div class="login-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card shadow-lg">
                    <div class="card-header text-white text-center">
                        <i class="fas fa-lock display-4 mb-2"></i>
                        <h3 class="mb-0">Connexion</h3>
                        <p class="mb-0 mt-1">Connectez-vous à votre espace personnel</p>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    <i class="fas fa-{% if 'error' in message.tags %}exclamation-circle{% else %}check-circle{% endif %} me-2"></i>
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">
                                    <i class="fas fa-user me-2 text-primary"></i>Nom d'utilisateur
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <input type="text" name="username" id="username" class="form-control" 
                                           placeholder="Entrez votre nom d'utilisateur" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">
                                    <i class="fas fa-lock me-2 text-primary"></i>Mot de passe
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-key"></i>
                                    </span>
                                    <input type="password" name="password" id="password" class="form-control" 
                                           placeholder="Entrez votre mot de passe" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-login text-white w-100 py-2">
                                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                            </button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small class="text-muted">
                            <i class="fas fa-headset me-1"></i>
                            Contactez l'administrateur si vous n'avez pas vos identifiants
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
